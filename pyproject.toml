[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "education-opportunity-phase1"
version = "0.4.7"
description = "Korea PISA 2022 educational opportunity model with time-responsive interventions and interpretable PCA maps"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyreadstat>=1.2.7",
  "requests>=2.31",
  "plotly>=5.24",
  "streamlit>=1.40",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27"
]

[tool.setuptools.packages.find]
where = ["src"]
